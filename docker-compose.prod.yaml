version: '3.8'

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        command: ["php", "artisan", "octane:start", "--server=frankenphp", "--workers=1", "--port=8080"]
        volumes:
            - laravel_logs:/var/www/html/storage/logs
        environment:
            PHP_FPM_POOL_NAME: "app"
            PHP_OPCACHE_ENABLE: 1
            AUTORUN_ENABLED: true
            AUTORUN_LARAVEL_STORAGE_LINK: false
            OCTANE_SERVER: 'frankenphp'
            OCTANE_HTTPS: false
            APP_NAME: '${APP_NAME:?}'
            APP_ENV: '${APP_ENV:?}'
            APP_KEY: '${APP_KEY:?}'
            APP_DEBUG: '${APP_DEBUG:?}'
            APP_URL: '${APP_URL:?}'
            APP_LOCALE: '${APP_LOCALE:?}'
            APP_FALLBACK_LOCALE: '${APP_FALLBACK_LOCALE:?}'
            APP_FAKER_LOCALE: '${APP_FAKER_LOCALE:?}'
            APP_MAINTENANCE_DRIVER: '${APP_MAINTENANCE_DRIVER:?}'
            BCRYPT_ROUNDS: '${BCRYPT_ROUNDS:?}'
            LOG_CHANNEL: '${LOG_CHANNEL:?}'
            LOG_STACK: '${LOG_STACK:?}'
            LOG_DEPRECATIONS_CHANNEL: '${LOG_DEPRECATIONS_CHANNEL:?}'
            LOG_LEVEL: '${LOG_LEVEL:?}'
            DB_CONNECTION: '${DB_CONNECTION:?}'
            DB_HOST: '${DB_HOST:?}'
            DB_PORT: '${DB_PORT:?}'
            DB_DATABASE: '${DB_DATABASE:?}'
            DB_USERNAME: '${DB_USERNAME:?}'
            DB_PASSWORD: '${DB_PASSWORD:?}'
            SESSION_DRIVER: '${SESSION_DRIVER:?}'
            SESSION_LIFETIME: '${SESSION_LIFETIME:?}'
            SESSION_ENCRYPT: '${SESSION_ENCRYPT:?}'
            SESSION_PATH: '${SESSION_PATH:?}'
            SESSION_DOMAIN: '${SESSION_DOMAIN:?}'
            SESSION_SECURE_COOKIE: '${SESSION_SECURE_COOKIE:?}'
            SESSION_EXPIRE_ON_CLOSE: '${SESSION_EXPIRE_ON_CLOSE:?}'
            FILESYSTEM_DISK: '${FILESYSTEM_DISK:?}'
            QUEUE_CONNECTION: '${QUEUE_CONNECTION:?}'
            CACHE_STORE: '${CACHE_STORE:?}'
            VITE_APP_NAME: '${APP_NAME:?}'
            APP_TIMEZONE: '${APP_TIMEZONE:?}'
            SANCTUM_STATEFUL_DOMAINS: '${SANCTUM_STATEFUL_DOMAINS:?}'
        healthcheck:
            test: ["CMD", "healthcheck-octane"]
            start_period: 10s

volumes:
  laravel_logs:
